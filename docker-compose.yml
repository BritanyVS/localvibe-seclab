services:
  postgres:
    image: postgres:16-alpine
    container_name: localvibe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: localvibe
      POSTGRES_USER: localvibe
      POSTGRES_PASSWORD: localvibe
    ports:
      - "5432:5432"
    volumes:
      - localvibe-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localvibe -d localvibe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localvibe-pg: